<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Loading… | The Kiln Ministries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <style>

:root {
  --cream:   #0d1b2e;
  --sand:    #a8c5e8;
  --clay:    #c9a84c;
  --ember:   #e0ba5f;
  --ash:     #6a8faf;
  --earth:   #f0f4f8;
  --charcoal:#060e18;
  --white:   #152338;
  --ff-display: 'Cormorant Garamond', Georgia, serif;
  --ff-body:    'Lora', Georgia, serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 17px; }
body {
  background: var(--cream);
  color: var(--earth);
  font-family: var(--ff-body);
  line-height: 1.75;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 3rem;
  transition: background 0.4s var(--ease-out), box-shadow 0.4s;
}
nav.scrolled {
  background: rgba(13, 27, 46, 0.97);
  backdrop-filter: blur(8px);
  box-shadow: 0 1px 0 rgba(168,197,232,0.1);
}
.nav-logo {
  font-family: var(--ff-display);
  font-size: 1.6rem; font-weight: 500;
  color: var(--earth); letter-spacing: 0.02em; text-decoration: none;
}
.nav-logo span { color: var(--clay); }
.nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
.nav-links a {
  font-family: var(--ff-body); font-size: 0.85rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ash); text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--clay); }
.nav-login {
  padding: 0.35rem 1rem !important;
  border: 1px solid rgba(201,168,76,0.4) !important;
  border-radius: 4px !important;
  color: var(--clay) !important;
  transition: background 0.2s, color 0.2s !important;
}
.nav-login:hover {
  background: var(--clay) !important;
  color: var(--charcoal) !important;
}
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; background: none; border: none; padding: 10px;
  min-width: 44px; min-height: 44px;
  justify-content: center; align-items: center;
}
.hamburger span {
  display: block; width: 24px; height: 2px;
  background: var(--earth); transition: all 0.3s;
}
.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: rgba(6,14,24,0.97); z-index: 200;
  flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: var(--ff-display); font-size: 2rem; font-weight: 300;
  color: var(--earth); text-decoration: none; letter-spacing: 0.05em;
}
.mobile-menu a:hover { color: var(--clay); }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
footer {
  background: var(--charcoal); color: var(--ash);
  text-align: center; padding: 3rem 2rem;
  font-family: var(--ff-body); font-size: 0.82rem; letter-spacing: 0.04em;
}
.footer-logo {
  font-family: var(--ff-display); font-size: 1.4rem; font-weight: 300;
  color: var(--earth); margin-bottom: 0.8rem;
}
.footer-logo em { color: var(--clay); font-style: italic; }
footer p { line-height: 1.9; color: var(--ash); }
footer a { color: var(--ash); text-decoration: none; }
footer a:hover { color: var(--clay); }
@media (max-width: 768px) {
  nav { padding: 1rem 1.5rem; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
}

/* Post hero */
.post-hero {
  min-height: 36vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 9rem 2rem 4rem;
  position: relative; overflow: hidden;
  border-bottom: 1px solid rgba(168,197,232,0.08);
}
.post-hero::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(30,58,95,0.4) 0%, transparent 60%);
  pointer-events: none;
}
.post-hero .embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.post-hero .ember {
  position: absolute; border-radius: 50%; background: var(--ember);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) scale(1); opacity: 0.6; }
  80%  { opacity: 0.3; }
  100% { transform: translateY(-80vh) scale(0.2); opacity: 0; }
}
.post-hero-category {
  font-family: var(--ff-body); font-size: 0.72rem;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--clay); margin-bottom: 1.4rem;
  padding: 0.3rem 0.9rem; border: 1px solid rgba(201,168,76,0.4);
  border-radius: 2px;
  position: relative; z-index: 2;
}
.post-hero-title {
  font-family: var(--ff-display);
  font-size: clamp(2.3rem, 6vw, 4.5rem);
  font-weight: 300; line-height: 1.05; color: var(--earth);
  letter-spacing: -0.01em;
  max-width: 900px; margin: 0 auto 0.6rem;
  position: relative; z-index: 2;
}
.post-hero-title em { font-style: italic; color: var(--clay); }
.post-hero-subtitle {
  font-family: var(--ff-display);
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  font-style: italic; font-weight: 300; color: var(--ash);
  max-width: 720px; margin: 0 auto 1.6rem; line-height: 1.5;
  position: relative; z-index: 2;
}
.post-hero-meta {
  font-family: var(--ff-body); font-size: 0.78rem;
  letter-spacing: 0.15em; color: var(--ash); opacity: 0.85;
  position: relative; z-index: 2;
}

/* Post body */
.post-body {
  max-width: 720px; margin: 0 auto; padding: 5rem 2rem;
}
.post-body p {
  font-family: var(--ff-body); font-size: 1.02rem;
  line-height: 1.9; color: var(--earth); opacity: 0.78;
  margin-bottom: 1.6rem; font-weight: 300;
}
.post-body p strong { color: var(--ember); font-weight: 600; }
.post-body p em { color: var(--clay); font-style: italic; }
.post-body h2 {
  font-family: var(--ff-display); font-size: 2rem; font-weight: 400;
  line-height: 1.2; color: var(--earth); margin: 3rem 0 1.2rem;
  letter-spacing: -0.005em;
}
.post-body h2 em { font-style: italic; color: var(--clay); }
.post-body h3 {
  font-family: var(--ff-body); font-size: 0.85rem; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ember); margin: 2.5rem 0 1rem;
}
.scripture-block {
  border-left: 2px solid var(--clay);
  background: rgba(201,168,76,0.06);
  padding: 1.4rem 1.8rem; margin: 2rem 0;
  border-radius: 0 2px 2px 0;
}
.scripture-block p {
  font-family: var(--ff-display); font-style: italic;
  font-size: 1.15rem; color: var(--earth); opacity: 1;
  margin-bottom: 0.6rem !important; line-height: 1.55;
}
.scripture-block .ref {
  font-family: var(--ff-body); font-style: normal;
  font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--clay); margin-bottom: 0 !important;
  opacity: 1;
}
.post-scripture-tag {
  text-align: center; padding: 2rem 0 0;
  border-top: 1px solid rgba(168,197,232,0.1);
  margin-top: 3rem;
}
.post-scripture-tag span {
  font-family: var(--ff-display); font-style: italic; font-size: 1.05rem;
  color: var(--ember);
}
.post-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 2.5rem; margin-top: 3rem;
  border-top: 1px solid rgba(168,197,232,0.1);
  flex-wrap: wrap; gap: 1rem;
}
.post-nav a {
  font-family: var(--ff-body); font-size: 0.78rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--clay); text-decoration: none;
  transition: color 0.2s;
}
.post-nav a:hover { color: var(--ember); }

/* Related posts */
.related {
  background: var(--white);
  border-top: 1px solid rgba(168,197,232,0.08);
  border-bottom: 1px solid rgba(168,197,232,0.08);
  padding: 4rem 2rem;
}
.related-inner { max-width: 1100px; margin: 0 auto; }
.related-label {
  font-family: var(--ff-body); font-size: 0.7rem;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--ember); text-align: center; margin-bottom: 2.5rem;
}
.related-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.5rem;
}
.related-card {
  background: var(--cream); border: 1px solid rgba(168,197,232,0.08);
  border-top: 2px solid transparent;
  padding: 1.5rem 1.6rem;
  text-decoration: none; display: block;
  transition: border-top-color 0.25s, transform 0.25s var(--ease-out);
}
.related-card:hover { border-top-color: var(--clay); transform: translateY(-2px); }
.related-card .post-category {
  font-family: var(--ff-body); font-size: 0.62rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--clay); display: inline-block;
  margin-bottom: 0.6rem;
}
.related-card .post-title {
  font-family: var(--ff-display); font-size: 1.15rem;
  font-weight: 400; line-height: 1.3; color: var(--earth);
}
.related-date {
  font-family: var(--ff-body); font-size: 0.7rem;
  letter-spacing: 0.15em; color: var(--ash); opacity: 0.7;
  margin-top: 0.6rem;
}

.error-state, .loading-state {
  max-width: 720px; margin: 0 auto;
  padding: 12rem 2rem 5rem; text-align: center;
}
.error-state h1 {
  font-family: var(--ff-display); font-size: 2.5rem; font-weight: 300;
  color: var(--earth); margin-bottom: 1rem;
}
.error-state h1 em { font-style: italic; color: var(--clay); }
.error-state p, .loading-state p {
  font-family: var(--ff-display); font-style: italic;
  color: var(--ash); font-size: 1.15rem; line-height: 1.6;
}
.error-state .tech {
  font-family: var(--ff-body); font-style: normal;
  font-size: 0.78rem; opacity: 0.6; margin-top: 0.8rem;
}
.error-state a {
  font-family: var(--ff-body); font-size: 0.78rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--clay); text-decoration: none;
  display: inline-block; margin-top: 2rem;
}

@media (max-width: 768px) {
  .post-body { padding: 3rem 1.5rem; }
  .post-body p { font-size: 1rem; }
  .related { padding: 3rem 1.5rem; }
}

  </style>
</head>
<body>

  <nav id="nav">
    <a class="nav-logo" href="index.html">The <span>Kiln</span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#services">Services</a></li>
      <li><a href="index.html#apps">Apps</a></li>
      <li><a href="blog.html">Articles</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="https://thegreatphysician.ai" target="_blank" class="nav-login">Counseling App</a></li>
      <li><a href="https://thekiln.org/admin" class="nav-login">Login</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html#about">About</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#apps">Apps</a>
    <a href="blog.html">Articles</a>
    <a href="index.html#contact">Contact</a>
    <a href="https://thegreatphysician.ai" target="_blank">Counseling App</a>
    <a href="https://thekiln.org/admin" style="color:var(--clay)">Login</a>
  </div>

  <main id="post-root">
    <div class="loading-state"><p>Loading…</p></div>
  </main>

  <footer>
    <div class="footer-logo">The <em>Kiln</em></div>
    <p>The Kiln Ministries · Jackson &amp; Nashville, Tennessee</p>
    <p style="margin-top: 0.6rem;">
      <a href="https://thegreatphysician.ai" target="_blank">Counseling App</a> ·
      <a href="mailto:support@thekiln.org">support@thekiln.org</a>
    </p>
  </footer>

<script>
(function() {
  // Embers in hero
  function spawnEmbers(host) {
    if (!host) return;
    for (let i = 0; i < 12; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      const size = 2 + Math.random() * 4;
      e.style.width = size + 'px';
      e.style.height = size + 'px';
      e.style.left = Math.random() * 100 + '%';
      e.style.bottom = '-10px';
      e.style.animationDuration = (4 + Math.random() * 5) + 's';
      e.style.animationDelay = (Math.random() * 5) + 's';
      host.appendChild(e);
    }
  }

  // Nav scroll
  const nav = document.getElementById('nav');
  if (nav) {
    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });
  }

  // Hamburger menu
  const hamb = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobile-menu');
  if (hamb && mobileMenu) {
    hamb.addEventListener('click', () => mobileMenu.classList.toggle('open'));
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => mobileMenu.classList.remove('open'));
    });
  }

  // Helpers
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    if (parts.length !== 3) return iso;
    const [y, m, d] = parts.map(Number);
    if (!y || !m || !d) return iso;
    return `${months[m-1]} ${d}, ${y}`;
  }

  function inlineMarkdown(text) {
    // text is already HTML-escaped; operate on the escaped form
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    return text;
  }

  function renderBodyElement(item) {
    const trimmed = (item || '').trim();
    if (!trimmed) return '';
    if (trimmed.startsWith('## ')) {
      return `<h2>${escapeHtml(trimmed.slice(3).trim())}</h2>`;
    }
    if (trimmed.startsWith('### ')) {
      return `<h3>${escapeHtml(trimmed.slice(4).trim())}</h3>`;
    }
    if (trimmed.startsWith('> ')) {
      const lines = trimmed.split('\n');
      const quoteLines = [];
      let ref = '';
      for (const ln of lines) {
        const t = ln.trim();
        if (t.startsWith('> ')) {
          quoteLines.push(t.slice(2).trim());
        } else if (t.startsWith('—')) {
          ref = t.replace(/^—\s*/, '').trim();
        }
      }
      const quote = quoteLines.join(' ');
      const refHtml = ref ? `<p class="ref">${escapeHtml(ref)}</p>` : '';
      return `<div class="scripture-block"><p>${escapeHtml(quote)}</p>${refHtml}</div>`;
    }
    return `<p>${inlineMarkdown(escapeHtml(trimmed))}</p>`;
  }

  function renderBody(bodyArray) {
    if (!Array.isArray(bodyArray)) return '';
    return bodyArray.map(renderBodyElement).filter(Boolean).join('\n');
  }

  function pickRelated(posts, currentSlug, currentCategory, max = 3) {
    const others = posts.filter(p => p.slug !== currentSlug);
    const sameCategory = others.filter(p => p.category === currentCategory);
    const rest = others.filter(p => p.category !== currentCategory);
    const sorted = (list) => list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return [...sorted(sameCategory), ...sorted(rest)].slice(0, max);
  }

  function renderRelated(related) {
    if (!related.length) return '';
    const cards = related.map(p => {
      const cat = p.category ? `<span class="post-category">${escapeHtml(p.category)}</span>` : '';
      return `
        <a class="related-card" href="post.html?slug=${encodeURIComponent(p.slug)}">
          ${cat}
          <p class="post-title">${escapeHtml(p.title)}</p>
          <p class="related-date">${escapeHtml(formatDate(p.date))}</p>
        </a>
      `;
    }).join('');
    return `
      <section class="related">
        <div class="related-inner">
          <p class="related-label">Continue Reading</p>
          <div class="related-grid">${cards}</div>
        </div>
      </section>
    `;
  }

  function renderPost(post, allPosts) {
    document.getElementById('page-title').textContent = `${post.title} | The Kiln Ministries`;
    const subtitle = post.subtitle ? `<p class="post-hero-subtitle">${escapeHtml(post.subtitle)}</p>` : '';
    const category = post.category ? `<p class="post-hero-category">${escapeHtml(post.category)}</p>` : '';
    const meta = [formatDate(post.date), post.author].filter(Boolean).join(' · ');
    const scriptureTag = post.scripture
      ? `<div class="post-scripture-tag"><span>${escapeHtml(post.scripture)}</span></div>`
      : '';
    const related = pickRelated(allPosts, post.slug, post.category, 3);

    document.getElementById('post-root').innerHTML = `
      <section class="post-hero">
        <div class="embers" id="post-embers"></div>
        ${category}
        <h1 class="post-hero-title">${escapeHtml(post.title)}</h1>
        ${subtitle}
        <p class="post-hero-meta">${escapeHtml(meta)}</p>
      </section>
      <article class="post-body">
        ${renderBody(post.body)}
        ${scriptureTag}
        <div class="post-nav">
          <a href="blog.html">← All Articles</a>
          <a href="https://thegreatphysician.ai" target="_blank" rel="noopener">Counseling App →</a>
        </div>
      </article>
      ${renderRelated(related)}
    `;
    spawnEmbers(document.getElementById('post-embers'));
  }

  function renderError(msg, technical) {
    document.getElementById('page-title').textContent = 'Article Not Found | The Kiln Ministries';
    const tech = technical ? `<p class="tech">${escapeHtml(technical)}</p>` : '';
    document.getElementById('post-root').innerHTML = `
      <div class="error-state">
        <h1>Article <em>not found</em></h1>
        <p>${escapeHtml(msg)}</p>
        ${tech}
        <a href="blog.html">← All Articles</a>
      </div>
    `;
  }

  // Get slug from query string
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    renderError('No article specified.');
    return;
  }

  fetch('posts.json', { cache: 'no-cache' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(posts => {
      if (!Array.isArray(posts)) throw new Error('posts.json is not an array');
      const post = posts.find(p => p.slug === slug);
      if (!post) {
        renderError(`No article with slug "${slug}".`);
        return;
      }
      renderPost(post, posts);
    })
    .catch(err => {
      renderError('Could not load this article.', err.message);
      console.error(err);
    });
})();
</script>

</body>
</html>
