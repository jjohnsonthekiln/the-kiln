<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Cream theme — matches the Great Physician / Kiln app palette. (Variable
     names kept for minimal churn; values flipped from the old navy theme.) */
  --navy: #faf8f4; --navy-2: #f0ebe0; --navy-3: #e8dfd0;
  --gold: #8b5e1a; --gold-fill: #c9a84c; --gold-dim: #7a6a58;
  --cream: #2c1a0e; --cream-dim: #7a6a58;
  --border: #e0d8cc;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Montserrat', sans-serif;
}
html, body { height: 100%; background: var(--navy); color: var(--cream); font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.login-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 24px rgba(44,26,14,0.06); }
.login-card input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--cream); font-family: var(--sans); font-size: 15px; outline: none; margin-bottom: 14px; }
.login-card input:focus { border-color: var(--gold-fill); }
input::placeholder, #filters input::placeholder { color: var(--gold-dim); }
.pw-wrap { position: relative; margin-bottom: 14px; }
.pw-wrap input { margin-bottom: 0; padding-right: 44px; }
.pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 8px; cursor: pointer; color: var(--gold-dim); display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: color 0.15s, background 0.15s; }
.pw-toggle:hover { color: var(--cream); background: rgba(44,26,14,0.05); }
.pw-toggle svg { display: block; width: 18px; height: 18px; }
.pw-toggle .eye-closed { display: none; }
.pw-toggle.showing .eye-open { display: none; }
.pw-toggle.showing .eye-closed { display: block; }
.btn { background: var(--gold-fill); color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: 0.3px; cursor: pointer; width: 100%; transition: opacity 0.15s; }
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.6; cursor: default; }
.err-msg { font-size: 13px; color: #a8412b; margin-top: 10px; }
#app { display: none; min-height: 100vh; }
header { background: var(--navy-2); border-bottom: 0.5px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-family: var(--serif); font-weight: 300; font-size: 22px; color: var(--gold); }
.logout-btn { background: none; border: 0.5px solid var(--border); border-radius: 6px; color: var(--gold-dim); padding: 6px 12px; font-size: 12px; cursor: pointer; }
.logout-btn:hover { color: var(--gold); border-color: var(--gold); }
.header-right { display: flex; align-items: center; gap: 14px; }
#source-toggle { display: flex; background: var(--navy-3); border: 0.5px solid var(--border); border-radius: 8px; overflow: hidden; }
.src-btn { background: transparent; border: none; color: var(--gold-dim); padding: 7px 14px; font-family: var(--sans); font-size: 12px; font-weight: 400; cursor: pointer; transition: background 0.15s, color 0.15s; }
.src-btn.active { background: var(--gold-fill); color: #fff; }
.src-btn:not(.active):hover { color: var(--gold); }
#stats-bar { display: flex; gap: 16px; padding: 16px 24px; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; }
.stat { background: var(--navy-2); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 18px; }
.stat-val { font-family: var(--serif); font-size: 26px; color: var(--gold); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--gold-dim); margin-top: 3px; }
#filters { display: flex; gap: 10px; padding: 14px 24px; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; align-items: center; }
#filters select, #filters input[type=date] { background: var(--navy-2); border: 0.5px solid var(--border); border-radius: 8px; color: var(--cream); font-family: var(--sans); font-size: 13px; padding: 7px 10px; outline: none; cursor: pointer; }
.filter-btn { background: var(--navy-3); border: 0.5px solid var(--border); border-radius: 8px; color: var(--gold); padding: 7px 16px; font-size: 13px; cursor: pointer; }
.filter-btn:hover { border-color: var(--gold); }
#main { display: flex; height: calc(100vh - 170px); }
#session-list { width: 300px; flex-shrink: 0; border-right: 0.5px solid var(--border); overflow-y: auto; }
#conversation-view { flex: 1; overflow-y: auto; padding: 20px 24px; }
.session-item { padding: 14px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s; }
.session-item:hover { background: var(--navy-2); }
.session-item.active { background: var(--navy-3); border-left: 2px solid var(--gold); }
.s-id { font-size: 11px; color: var(--gold-dim); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { display: flex; justify-content: space-between; margin-top: 4px; }
.s-lang { font-size: 12px; color: var(--gold); }
.s-date { font-size: 11px; color: var(--cream-dim); }
.load-more { padding: 14px; text-align: center; cursor: pointer; font-size: 13px; color: var(--gold-dim); }
.load-more:hover { color: var(--gold); }
.s-delete { font-size: 11px; color: #d07070; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; margin-left: 6px; }
.session-item:hover .s-delete { opacity: 1; }
.s-delete:hover { background: rgba(192,48,64,0.15); }
#conversation-view .placeholder { text-align: center; color: var(--gold-dim); font-family: var(--serif); font-size: 18px; margin-top: 60px; }
.conv-header { margin-bottom: 20px; padding-bottom: 14px; border-bottom: 0.5px solid var(--border); }
.conv-header h2 { font-family: var(--serif); font-weight: 300; font-size: 20px; color: var(--gold); }
.conv-header p { font-size: 12px; color: var(--gold-dim); margin-top: 4px; }
.message { margin-bottom: 16px; }
.msg-label { font-size: 11px; color: var(--gold-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.msg-bubble { padding: 14px 18px; border-radius: 10px; font-size: 16px; line-height: 1.75; font-weight: 300; white-space: pre-wrap; }
.msg-bubble.user { background: var(--navy-3); border: 0.5px solid var(--border); color: var(--cream); }
.msg-bubble.ai { background: #fff; border: 0.5px solid var(--border); color: var(--cream); }
.loading { text-align: center; color: var(--gold-dim); padding: 40px; font-size: 14px; }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <input type="text" id="user-input" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" />
    <div class="pw-wrap">
      <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password" />
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" tabindex="-1">
        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10.5 7.5 10.5 7.5a18.2 18.2 0 0 1-3.4 4.3"/><path d="M6.5 7.6A18.5 18.5 0 0 0 1.5 12s4 7.5 10.5 7.5a10.9 10.9 0 0 0 4.6-1"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <button class="btn" id="login-btn">Sign In</button>
    <div class="err-msg" id="login-err"></div>
  </div>
</div>
<div id="app">
  <header>
    <h1>Conversation Viewer</h1>
    <div class="header-right">
      <div id="source-toggle">
        <button class="src-btn active" data-src="ctm">Come to Me</button>
        <button class="src-btn" data-src="gp">Great Physician</button>
      </div>
      <button class="logout-btn" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <div id="stats-bar"></div>
  <div id="filters">
    <select id="lang-filter">
      <option value="">All Languages</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
      <option value="hi">हिन्दी</option>
      <option value="ru">Русский</option>
    </select>
    <input type="date" id="date-from" />
    <input type="date" id="date-to" />
    <button class="filter-btn" id="apply-filter">Apply</button>
    <button class="filter-btn" id="clear-filter">Clear</button>
  </div>
  <div id="main">
    <div id="session-list"></div>
    <div id="conversation-view"><p class="placeholder">Select a session to view</p></div>
  </div>
</div>
<script>
'use strict';
// The password is validated SERVER-SIDE in functions/api/* against the
// ADMIN_PASSWORD environment variable (a Cloudflare Pages secret) — it is
// never shipped to the browser. The username below is only a cosmetic
// label, not a secret.
const ADMIN_USER = 'admin';
const API_ENDPOINTS = {
  ctm: '/api/conversations',
  gp:  '/api/gp-conversations',
};
let currentSource = 'ctm';
let password = '';
let offset = 0;
const LIMIT = 30;
let currentFilters = {};

function apiUrl() { return API_ENDPOINTS[currentSource]; }

// Source toggle
document.querySelectorAll('.src-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const src = btn.dataset.src;
    if (src === currentSource) return;
    currentSource = src;
    document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.src === src));
    // Lang filter only applies to Come to Me
    document.getElementById('lang-filter').style.display = src === 'gp' ? 'none' : '';
    // Reset filters and reload everything
    currentFilters = {};
    document.getElementById('lang-filter').value = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    document.getElementById('conversation-view').innerHTML = '<p class="placeholder">Select a session to view</p>';
    if (password) { loadStats(); loadSessions(true); }
  });
});

document.getElementById('user-input').addEventListener('keydown', e => { if (e.key === 'Enter') { document.getElementById('pw-input').focus(); } });
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', () => {
  offset = 0;
  password = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('user-input').value = '';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';
});

// Show/hide password toggle
document.getElementById('pw-toggle').addEventListener('click', () => {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');
  const showing = toggle.classList.toggle('showing');
  input.type = showing ? 'text' : 'password';
  toggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
  input.focus();
});

async function login() {
  const user  = document.getElementById('user-input').value.trim();
  const pw    = document.getElementById('pw-input').value.trim();
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  errEl.textContent = '';
  if (user !== ADMIN_USER || !pw) {
    errEl.textContent = 'Incorrect username or password.';
    return;
  }
  // Validate the password against the server; it is never stored in this page.
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch(API_ENDPOINTS.ctm, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, action: 'sessions', limit: 1, offset: 0 }),
    });
    if (res.status === 401) { errEl.textContent = 'Incorrect username or password.'; return; }
    if (!res.ok)            { errEl.textContent = 'Server error — please try again.'; return; }
    password = pw;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadStats();
    loadSessions(true);
  } catch (e) {
    errEl.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

async function call(body) {
  const res = await fetch(apiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password, ...body })
  });
  return res.json();
}

async function loadStats() {
  const data = await call({ action: 'stats' });
  if (data.error) { console.error('Stats error:', data.error); return; }
  if (currentSource === 'gp') {
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><div class="stat-val">${data.total}</div><div class="stat-lbl">Total Messages</div></div>
      <div class="stat"><div class="stat-val">${data.sessions ?? '—'}</div><div class="stat-lbl">Total Sessions</div></div>`;
  } else {
    const langs = Object.entries(data.langCounts || {}).sort((a,b) => b[1]-a[1]).slice(0,6).map(([l,c]) => `${l.toUpperCase()}: ${c}`).join(' · ');
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><div class="stat-val">${data.total}</div><div class="stat-lbl">Total Messages</div></div>
      <div class="stat"><div class="stat-val" style="font-size:14px;padding-top:6px;">${langs||'—'}</div><div class="stat-lbl">By Language</div></div>`;
  }
}

document.getElementById('apply-filter').addEventListener('click', () => {
  currentFilters = {
    lang: document.getElementById('lang-filter').value || null,
    date_from: document.getElementById('date-from').value || null,
    date_to: document.getElementById('date-to').value || null
  };
  loadSessions(true);
});
document.getElementById('clear-filter').addEventListener('click', () => {
  document.getElementById('lang-filter').value = '';
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  currentFilters = {};
  loadSessions(true);
});

async function loadSessions(reset = false) {
  if (reset) { offset = 0; document.getElementById('session-list').innerHTML = '<div class="loading">Loading…</div>'; }
  const data = await call({ action: 'sessions', limit: LIMIT, offset, ...currentFilters });
  if (data.error) { document.getElementById('session-list').innerHTML = `<div class="loading" style="color:#d07070">${data.error}</div>`; return; }
  offset += data.sessions.length;
  const list = document.getElementById('session-list');
  if (reset) list.innerHTML = '';
  data.sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'session-item';
    el.dataset.id = s.session_id;
    const langBadge = currentSource === 'gp' ? '' : `<span class="s-lang">${(s.lang||'').toUpperCase()}</span>`;
    el.innerHTML = `<div class="s-id">${s.session_id}</div><div class="s-meta">${langBadge}<span class="s-date">${new Date(s.created_at).toLocaleDateString()}</span><button class="s-delete" title="Delete session">✕</button></div>`;
    el.addEventListener('click', () => loadMessages(s.session_id, s.lang, s.created_at, el));
    el.querySelector('.s-delete').addEventListener('click', e => { e.stopPropagation(); deleteSession(s.session_id, el); });
    list.appendChild(el);
  });
  if (data.sessions.length === LIMIT) {
    const more = document.createElement('div');
    more.className = 'load-more';
    more.textContent = 'Load more…';
    more.addEventListener('click', () => { more.remove(); loadSessions(false); });
    list.appendChild(more);
  }
}

async function loadMessages(session_id, lang, date, el) {
  document.querySelectorAll('.session-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  const view = document.getElementById('conversation-view');
  view.innerHTML = '<div class="loading">Loading…</div>';
  const data = await call({ action: 'messages', session_id });
  if (data.error) { view.innerHTML = `<div class="loading" style="color:#d07070">${data.error}</div>`; return; }

  if (currentSource === 'gp') {
    // GP schema: one row per message with role + content
    view.innerHTML = `<div class="conv-header"><h2>Session</h2><p>${new Date(date).toLocaleString()} · ${data.messages.length} message(s) · ID: ${session_id}</p></div>`;
    data.messages.forEach(m => {
      const isUser = (m.role || '').toLowerCase() === 'user';
      const label = isUser ? 'User' : 'Counselor';
      const cls   = isUser ? 'user' : 'ai';
      view.innerHTML += `<div class="message"><div class="msg-label">${label}</div><div class="msg-bubble ${cls}">${escHtml(m.content)}</div></div>`;
    });
  } else {
    // CTM schema: one row per Q&A turn (user_message + ai_response paired)
    view.innerHTML = `<div class="conv-header"><h2>Session — ${(lang||'').toUpperCase()}</h2><p>${new Date(date).toLocaleString()} · ${data.messages.length} turn(s) · ID: ${session_id}</p></div>`;
    data.messages.forEach(m => {
      view.innerHTML += `<div class="message"><div class="msg-label">Visitor</div><div class="msg-bubble user">${escHtml(m.user_message)}</div></div><div class="message"><div class="msg-label">AI</div><div class="msg-bubble ai">${escHtml(m.ai_response)}</div></div>`;
    });
  }
}

async function deleteSession(session_id, el) {
  if (!confirm('Delete all messages for this session?\n\n' + session_id)) return;
  const data = await call({ action: 'delete', session_id });
  if (data.error) { alert('Delete failed: ' + data.error); return; }
  el.remove();
  document.getElementById('conversation-view').innerHTML = '<p class="placeholder">Session deleted</p>';
  loadStats();
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
