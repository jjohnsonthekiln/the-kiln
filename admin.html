<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Cream theme — matches the Great Physician / Kiln app palette. (Variable
     names kept for minimal churn; values flipped from the old navy theme.) */
  --navy: #faf8f4; --navy-2: #f0ebe0; --navy-3: #e8dfd0;
  --gold: #8b5e1a; --gold-fill: #c9a84c; --gold-dim: #7a6a58;
  --cream: #2c1a0e; --cream-dim: #7a6a58;
  --border: #e0d8cc;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Montserrat', sans-serif;
}
html, body { height: 100%; background: var(--navy); color: var(--cream); font-family: var(--sans); font-weight: 400; -webkit-font-smoothing: antialiased; }
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.login-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 24px rgba(44,26,14,0.06); }
.login-card input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--cream); font-family: var(--sans); font-size: 15px; outline: none; margin-bottom: 14px; }
.login-card input:focus { border-color: var(--gold-fill); }
input::placeholder, #filters input::placeholder { color: var(--gold-dim); }
.pw-wrap { position: relative; margin-bottom: 14px; }
.pw-wrap input { margin-bottom: 0; padding-right: 44px; }
.pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 8px; cursor: pointer; color: var(--gold-dim); display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: color 0.15s, background 0.15s; }
.pw-toggle:hover { color: var(--cream); background: rgba(44,26,14,0.05); }
.pw-toggle svg { display: block; width: 18px; height: 18px; }
.pw-toggle .eye-closed { display: none; }
.pw-toggle.showing .eye-open { display: none; }
.pw-toggle.showing .eye-closed { display: block; }
.btn { background: var(--gold-fill); color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: 0.3px; cursor: pointer; width: 100%; transition: opacity 0.15s; }
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.6; cursor: default; }
.err-msg { font-size: 13px; color: #a8412b; margin-top: 10px; }
#app { display: none; min-height: 100vh; }
header { background: var(--navy-2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-family: var(--serif); font-weight: 600; font-size: 23px; color: var(--gold); letter-spacing: 0.3px; }
.logout-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--gold-dim); padding: 6px 12px; font-size: 12px; cursor: pointer; }
.logout-btn:hover { color: var(--gold); border-color: var(--gold); }
.header-right { display: flex; align-items: center; gap: 14px; }
#source-toggle { display: flex; background: var(--navy-3); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.src-btn { background: transparent; border: none; color: var(--gold-dim); padding: 7px 14px; font-family: var(--sans); font-size: 12px; font-weight: 400; cursor: pointer; transition: background 0.15s, color 0.15s; }
.src-btn.active { background: var(--gold-fill); color: #fff; }
.src-btn:not(.active):hover { color: var(--gold); }
#stats-bar { display: flex; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.stat { background: var(--navy-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; }
.stat-val { font-family: var(--serif); font-weight: 600; font-size: 26px; color: var(--gold); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--gold-dim); margin-top: 3px; }
#filters { display: flex; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
#filters select, #filters input[type=date] { background: var(--navy-2); border: 1px solid var(--border); border-radius: 8px; color: var(--cream); font-family: var(--sans); font-size: 13px; padding: 7px 10px; outline: none; cursor: pointer; }
.filter-btn { background: var(--navy-3); border: 1px solid var(--border); border-radius: 8px; color: var(--gold); padding: 7px 16px; font-size: 13px; cursor: pointer; }
.filter-btn:hover { border-color: var(--gold); }
#main { display: flex; height: calc(100vh - 170px); }
#session-list { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; }
#conversation-view { flex: 1; overflow-y: auto; padding: 20px 24px; }
.session-item { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.session-item:hover { background: var(--navy-2); }
.session-item.active { background: var(--navy-3); border-left: 2px solid var(--gold); }
.s-cb { flex-shrink: 0; width: 15px; height: 15px; margin-top: 1px; accent-color: var(--gold-fill); cursor: pointer; }
.s-body { flex: 1; min-width: 0; }
.s-id { font-size: 11px; color: var(--gold-dim); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { display: flex; justify-content: space-between; margin-top: 4px; }
.s-lang { font-size: 12px; color: var(--gold); }
.s-date { font-size: 11px; color: var(--cream-dim); }
.load-more { padding: 14px; text-align: center; cursor: pointer; font-size: 13px; color: var(--gold-dim); }
.load-more:hover { color: var(--gold); }
.s-delete { font-size: 11px; color: #a8412b; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; margin-left: 6px; }
.session-item:hover .s-delete { opacity: 1; }
.s-delete:hover { background: rgba(168,65,43,0.12); }
#conversation-view .placeholder { text-align: center; color: var(--gold-dim); font-family: var(--serif); font-size: 18px; margin-top: 60px; }
.conv-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.conv-header h2 { font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--gold); }
.conv-header p { font-size: 12px; color: var(--gold-dim); margin-top: 4px; }
.print-btn { flex-shrink: 0; background: var(--gold-fill); border: 1px solid var(--gold-fill); border-radius: 8px; color: #fff; padding: 7px 14px; font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
.print-btn:hover { opacity: 0.88; }
.conv-actions { flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
.print-btn.alt { background: transparent; color: var(--gold-fill); }
.txt-opt { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--gold-dim); cursor: pointer; white-space: nowrap; }
.txt-opt input { cursor: pointer; }
.message { margin-bottom: 16px; }
.msg-label { font-size: 11px; color: var(--gold-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.msg-bubble { padding: 14px 18px; border-radius: 10px; font-size: 15px; line-height: 1.7; font-weight: 400; white-space: pre-wrap; }
.msg-bubble.user { background: var(--navy-3); border: 1px solid var(--border); color: var(--cream); }
.msg-bubble.ai { background: #fff; border: 1px solid var(--border); color: var(--cream); }
.loading { text-align: center; color: var(--gold-dim); padding: 40px; font-size: 14px; }
.sel-all-lbl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gold-dim); cursor: pointer; user-select: none; }
.sel-all-lbl input { width: 14px; height: 14px; accent-color: var(--gold-fill); cursor: pointer; }
#print-selected:disabled, #delete-selected:disabled { opacity: 0.45; cursor: default; }
.danger-btn { color: #a8412b; }
.danger-btn:hover:not(:disabled) { border-color: #a8412b; }

/* Off-screen stage used to build a clean, light document that html2canvas
   rasterizes; generatePdf() then paginates it into a one-click PDF. */
.pdf-stage { position: fixed; left: -10000px; top: 0; width: 720px; background: #fff; }
.pdf-doc { background: #fff; color: #1a1a1a; font-family: 'Montserrat', Arial, sans-serif; font-weight: 400; }
.pdf-sess { padding: 6px 24px 24px; }
.pdf-sess + .pdf-sess { page-break-before: always; }
.pdf-head { border-bottom: 1px solid #999; padding-bottom: 10px; margin-bottom: 16px; }
.pdf-h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 22px; color: #111; }
.pdf-sub { font-size: 12px; color: #555; margin-top: 4px; }
.pdf-msg { margin-bottom: 14px; page-break-inside: avoid; }
.pdf-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.pdf-bubble { padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #ccc; }
.pdf-bubble.u { background: #f3f3f3; }
.pdf-bubble.a { background: #fff; }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <form id="login-form">
    <input type="text" id="user-input" name="username" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" />
    <div class="pw-wrap">
      <input type="password" id="pw-input" name="password" placeholder="Password" autocomplete="current-password" />
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" tabindex="-1">
        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10.5 7.5 10.5 7.5a18.2 18.2 0 0 1-3.4 4.3"/><path d="M6.5 7.6A18.5 18.5 0 0 0 1.5 12s4 7.5 10.5 7.5a10.9 10.9 0 0 0 4.6-1"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <button type="submit" class="btn" id="login-btn">Sign In</button>
    </form>
    <div class="err-msg" id="login-err"></div>
  </div>
</div>
<div id="app">
  <header>
    <h1>Conversation Viewer</h1>
    <div class="header-right">
      <div id="source-toggle">
        <button class="src-btn active" data-src="ctm">Come to Me</button>
        <button class="src-btn" data-src="gp">Great Physician</button>
      </div>
      <button class="logout-btn" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <div id="stats-bar"></div>
  <div id="filters">
    <select id="lang-filter">
      <option value="">All Languages</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
      <option value="hi">हिन्दी</option>
      <option value="ru">Русский</option>
    </select>
    <input type="date" id="date-from" />
    <input type="date" id="date-to" />
    <button class="filter-btn" id="apply-filter">Apply</button>
    <button class="filter-btn" id="clear-filter">Clear</button>
    <label class="sel-all-lbl"><input type="checkbox" id="select-all"> Select all</label>
    <button class="filter-btn" id="print-selected" disabled>⤓ Save selected</button>
    <button class="filter-btn danger-btn" id="delete-selected" disabled>✕ Delete checked</button>
  </div>
  <div id="main">
    <div id="session-list"></div>
    <div id="conversation-view"><p class="placeholder">Select a session to view</p></div>
  </div>
</div>
<!-- jsPDF 2.5.2 + html2canvas 1.4.1 — vendored locally (see vendor/) so the admin
     has no external runtime dependency. We paginate manually (see generatePdf)
     to avoid slicing through lines of text. -->
<script src="/vendor/jspdf.umd.min.js"></script>
<script src="/vendor/html2canvas.min.js"></script>
<script>
'use strict';
// The password is validated SERVER-SIDE in functions/api/* against the
// ADMIN_PASSWORD environment variable (a Cloudflare Pages secret) — it is
// never shipped to the browser. The username below is only a cosmetic
// label, not a secret.
const ADMIN_USER = 'admin';
const API_ENDPOINTS = {
  ctm: '/api/conversations',
  gp:  '/api/gp-conversations',
};
let currentSource = 'ctm';
let password = '';
let offset = 0;
const LIMIT = 30;
let currentFilters = {};
let currentConv = null;            // {session_id, lang, date, source, messages} of the open conversation
const selected = new Map();        // session_id -> {lang, date, source} for batch PDF export

function apiUrl() { return API_ENDPOINTS[currentSource]; }

// Source toggle
document.querySelectorAll('.src-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const src = btn.dataset.src;
    if (src === currentSource) return;
    currentSource = src;
    document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.src === src));
    // Lang filter only applies to Come to Me
    document.getElementById('lang-filter').style.display = src === 'gp' ? 'none' : '';
    // Reset filters and reload everything
    currentFilters = {};
    document.getElementById('lang-filter').value = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    selected.clear();
    document.getElementById('select-all').checked = false;
    updateSelCount();
    currentConv = null;
    document.getElementById('conversation-view').innerHTML = '<p class="placeholder">Select a session to view</p>';
    if (password) { loadStats(); loadSessions(true); }
  });
});

// Enter in the username field jumps to the password field instead of submitting.
document.getElementById('user-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('pw-input').focus(); } });
// Submit the real <form> so the browser's password manager offers to save the
// credentials (and autofills them next visit). preventDefault stops the page
// navigation; login() validates against the server as before.
document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); login(); });
document.getElementById('logout-btn').addEventListener('click', () => {
  offset = 0;
  password = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('user-input').value = '';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';
});

// Show/hide password toggle
document.getElementById('pw-toggle').addEventListener('click', () => {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');
  const showing = toggle.classList.toggle('showing');
  input.type = showing ? 'text' : 'password';
  toggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
  input.focus();
});

async function login() {
  const user  = document.getElementById('user-input').value.trim();
  const pw    = document.getElementById('pw-input').value.trim();
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  errEl.textContent = '';
  if (user !== ADMIN_USER || !pw) {
    errEl.textContent = 'Incorrect username or password.';
    return;
  }
  // Validate the password against the server; it is never stored in this page.
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch(API_ENDPOINTS.ctm, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, action: 'sessions', limit: 1, offset: 0 }),
    });
    if (res.status === 401) { errEl.textContent = 'Incorrect username or password.'; return; }
    if (!res.ok)            { errEl.textContent = 'Server error — please try again.'; return; }
    password = pw;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadStats();
    loadSessions(true);
  } catch (e) {
    errEl.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

async function call(body) {
  const res = await fetch(apiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password, ...body })
  });
  return res.json();
}

async function loadStats() {
  const data = await call({ action: 'stats' });
  if (data.error) { console.error('Stats error:', data.error); return; }
  if (currentSource === 'gp') {
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><div class="stat-val">${data.total}</div><div class="stat-lbl">Total Messages</div></div>
      <div class="stat"><div class="stat-val">${data.sessions ?? '—'}</div><div class="stat-lbl">Total Sessions</div></div>`;
  } else {
    const langs = Object.entries(data.langCounts || {}).sort((a,b) => b[1]-a[1]).slice(0,6).map(([l,c]) => `${l.toUpperCase()}: ${c}`).join(' · ');
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><div class="stat-val">${data.total}</div><div class="stat-lbl">Total Messages</div></div>
      <div class="stat"><div class="stat-val" style="font-size:14px;padding-top:6px;">${langs||'—'}</div><div class="stat-lbl">By Language</div></div>`;
  }
}

document.getElementById('apply-filter').addEventListener('click', () => {
  currentFilters = {
    lang: document.getElementById('lang-filter').value || null,
    date_from: document.getElementById('date-from').value || null,
    date_to: document.getElementById('date-to').value || null
  };
  loadSessions(true);
});
document.getElementById('clear-filter').addEventListener('click', () => {
  document.getElementById('lang-filter').value = '';
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  currentFilters = {};
  loadSessions(true);
});

async function loadSessions(reset = false) {
  if (reset) { offset = 0; document.getElementById('select-all').checked = false; document.getElementById('session-list').innerHTML = '<div class="loading">Loading…</div>'; }
  const data = await call({ action: 'sessions', limit: LIMIT, offset, ...currentFilters });
  if (data.error) { document.getElementById('session-list').innerHTML = `<div class="loading" style="color:#d07070">${data.error}</div>`; return; }
  offset += data.sessions.length;
  const list = document.getElementById('session-list');
  if (reset) list.innerHTML = '';
  data.sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'session-item';
    el.dataset.id = s.session_id;
    const langBadge = currentSource === 'gp' ? '' : `<span class="s-lang">${(s.lang||'').toUpperCase()}</span>`;
    el.innerHTML = `<input type="checkbox" class="s-cb" title="Select for batch PDF"><div class="s-body"><div class="s-id">${s.session_id}</div><div class="s-meta">${langBadge}<span class="s-date">${new Date(s.created_at).toLocaleDateString()}</span><button class="s-delete" title="Delete session">✕</button></div></div>`;
    el.addEventListener('click', () => loadMessages(s.session_id, s.lang, s.created_at, el));
    el.querySelector('.s-delete').addEventListener('click', e => { e.stopPropagation(); deleteSession(s.session_id, el); });
    const cb = el.querySelector('.s-cb');
    cb.checked = selected.has(s.session_id);
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => {
      if (cb.checked) selected.set(s.session_id, { lang: s.lang, date: s.created_at, source: currentSource });
      else selected.delete(s.session_id);
      updateSelCount();
    });
    list.appendChild(el);
  });
  if (data.sessions.length === LIMIT) {
    const more = document.createElement('div');
    more.className = 'load-more';
    more.textContent = 'Load more…';
    more.addEventListener('click', () => { more.remove(); loadSessions(false); });
    list.appendChild(more);
  }
}

async function loadMessages(session_id, lang, date, el) {
  document.querySelectorAll('.session-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  const view = document.getElementById('conversation-view');
  view.innerHTML = '<div class="loading">Loading…</div>';
  const data = await call({ action: 'messages', session_id });
  if (data.error) { view.innerHTML = `<div class="loading" style="color:#d07070">${data.error}</div>`; return; }

  currentConv = { session_id, lang, date, source: currentSource, messages: data.messages };
  document.title = `Kiln Conversation — ${session_id}`;

  if (currentSource === 'gp') {
    // GP schema: one row per message with role + content
    view.innerHTML = `<div class="conv-header"><div><h2>Session</h2><p>${new Date(date).toLocaleString()} · ${data.messages.length} message(s) · ID: ${session_id}</p></div><div class="conv-actions"><label class="txt-opt"><input type="checkbox" id="txt-opt-id"> ID</label><label class="txt-opt"><input type="checkbox" id="txt-opt-count"> Count</label><button class="print-btn alt" onclick="exportTxtCurrent()" title="Export a clean plain-text transcript to feed as context into a Great Physician session">⤓ Export .txt</button><button class="print-btn" onclick="savePdfCurrent()" title="Save this conversation as a PDF">⤓ Save PDF</button></div></div>`;
    data.messages.forEach(m => {
      const isUser = (m.role || '').toLowerCase() === 'user';
      const label = isUser ? 'User' : 'Counselor';
      const cls   = isUser ? 'user' : 'ai';
      view.innerHTML += `<div class="message"><div class="msg-label">${label}</div><div class="msg-bubble ${cls}">${escHtml(m.content)}</div></div>`;
    });
  } else {
    // CTM schema: one row per Q&A turn (user_message + ai_response paired)
    view.innerHTML = `<div class="conv-header"><div><h2>Session — ${(lang||'').toUpperCase()}</h2><p>${new Date(date).toLocaleString()} · ${data.messages.length} turn(s) · ID: ${session_id}</p></div><div class="conv-actions"><label class="txt-opt"><input type="checkbox" id="txt-opt-id"> ID</label><label class="txt-opt"><input type="checkbox" id="txt-opt-count"> Count</label><button class="print-btn alt" onclick="exportTxtCurrent()" title="Export a clean plain-text transcript to feed as context into a Great Physician session">⤓ Export .txt</button><button class="print-btn" onclick="savePdfCurrent()" title="Save this conversation as a PDF">⤓ Save PDF</button></div></div>`;
    data.messages.forEach(m => {
      view.innerHTML += `<div class="message"><div class="msg-label">Visitor</div><div class="msg-bubble user">${escHtml(m.user_message)}</div></div><div class="message"><div class="msg-label">AI</div><div class="msg-bubble ai">${escHtml(m.ai_response)}</div></div>`;
    });
  }
}

async function deleteSession(session_id, el) {
  if (!confirm('Delete all messages for this session?\n\n' + session_id)) return;
  const data = await call({ action: 'delete', session_id });
  if (data.error) { alert('Delete failed: ' + data.error); return; }
  el.remove();
  selected.delete(session_id);
  updateSelCount();
  document.getElementById('conversation-view').innerHTML = '<p class="placeholder">Session deleted</p>';
  loadStats();
}

// Keyboard navigation: ↑/↓ step through sessions and load them, so you can
// move through conversations without the mouse.
document.addEventListener('keydown', (e) => {
  if (document.getElementById('app').style.display !== 'block') return;       // logged out
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;       // don't hijack form fields
  const items = Array.from(document.querySelectorAll('.session-item'));
  if (!items.length) return;
  e.preventDefault();
  const current = document.querySelector('.session-item.active');
  let idx = current ? items.indexOf(current) : -1;
  if (e.key === 'ArrowDown') {
    if (idx >= items.length - 1) { const more = document.querySelector('.load-more'); if (more) more.click(); return; }
    idx = idx + 1;
  } else {
    idx = idx <= 0 ? 0 : idx - 1;
  }
  const target = items[idx];
  if (target) { target.click(); target.scrollIntoView({ block: 'nearest' }); }
});

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- PDF export (one-click, no browser print dialog) ----

function updateSelCount() {
  const n = selected.size;
  const ps = document.getElementById('print-selected');
  ps.textContent = n ? `⤓ Save selected (${n})` : '⤓ Save selected';
  ps.disabled = n === 0;
  const ds = document.getElementById('delete-selected');
  ds.textContent = n ? `✕ Delete checked (${n})` : '✕ Delete checked';
  ds.disabled = n === 0;
}

// Build the light-themed HTML for one session, honoring its schema.
function buildSessionHtml(item) {
  const dateStr = new Date(item.date).toLocaleString();
  let head, rows = '';
  if (item.source === 'gp') {
    head = `<h2 class="pdf-h2">Session</h2><p class="pdf-sub">${dateStr} · ${item.messages.length} message(s) · ID: ${item.session_id}</p>`;
    item.messages.forEach(m => {
      const isUser = (m.role || '').toLowerCase() === 'user';
      rows += `<div class="pdf-msg"><div class="pdf-label">${isUser ? 'User' : 'Counselor'}</div><div class="pdf-bubble ${isUser ? 'u' : 'a'}">${escHtml(m.content)}</div></div>`;
    });
  } else {
    head = `<h2 class="pdf-h2">Session — ${(item.lang || '').toUpperCase()}</h2><p class="pdf-sub">${dateStr} · ${item.messages.length} turn(s) · ID: ${item.session_id}</p>`;
    item.messages.forEach(m => {
      rows += `<div class="pdf-msg"><div class="pdf-label">Visitor</div><div class="pdf-bubble u">${escHtml(m.user_message)}</div></div>`
            + `<div class="pdf-msg"><div class="pdf-label">AI</div><div class="pdf-bubble a">${escHtml(m.ai_response)}</div></div>`;
    });
  }
  return `<section class="pdf-sess"><div class="pdf-head">${head}</div>${rows}</section>`;
}

// A4 portrait layout, in millimetres.
const PDF = { pageW: 210, pageH: 297, mL: 12, mR: 12, mT: 12, mB: 16 };

// Render one session's HTML to a canvas via html2canvas (off-screen).
async function renderSessionCanvas(item) {
  const stage = document.createElement('div');
  stage.className = 'pdf-stage';
  stage.innerHTML = `<div class="pdf-doc">${buildSessionHtml(item)}</div>`;
  document.body.appendChild(stage);
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (_) {} }
    return await html2canvas(stage.firstChild, { scale: 2, backgroundColor: '#ffffff', windowWidth: 720 });
  } finally {
    stage.remove();
  }
}

// Find the lowest pixel row in [minY, maxY] that holds no dark (text) pixels,
// so a page break there can't slice through a line of text. The gaps between
// lines and between message bubbles are all light, which gives us safe cuts in
// any language. Falls back to maxY if the whole band is solid (rare).
function safeCutRow(data, w, minY, maxY) {
  const DARK = 140;   // luminance below this counts as ink/text
  const step = 3;     // sample every 3rd column — fast and reliable enough
  for (let y = maxY; y >= minY; y--) {
    const base = y * w * 4;
    let clean = true;
    for (let x = 0; x < w; x += step) {
      const i = base + x * 4;
      if ((data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) < DARK) { clean = false; break; }
    }
    if (clean) return y;
  }
  return maxY;
}

// Build a multi-page PDF. Each session starts on a fresh page; long sessions
// paginate at blank rows so no message is ever cut mid-line.
async function generatePdf(items, filename) {
  if (!items.length) return;
  if (!window.jspdf || !window.html2canvas) { alert('PDF library failed to load. Check your connection and reload.'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const contentW = PDF.pageW - PDF.mL - PDF.mR;
  const contentH = PDF.pageH - PDF.mT - PDF.mB;

  const slice = document.createElement('canvas');
  const sctx = slice.getContext('2d');
  let firstPage = true;

  try {
    for (const item of items) {
      const canvas = await renderSessionCanvas(item);
      const W = canvas.width, H = canvas.height;
      const pxPerMm = W / contentW;
      const pageHpx = Math.floor(contentH * pxPerMm);
      const data = canvas.getContext('2d').getImageData(0, 0, W, H).data;

      let y = 0;
      while (y < H) {
        let end = Math.min(y + pageHpx, H);
        if (end < H) {
          // Keep pages reasonably full: never cut higher than ~55% down.
          const minEnd = Math.min(end, y + Math.floor(pageHpx * 0.55));
          end = safeCutRow(data, W, Math.max(minEnd, y + 1), end);
        }
        const hpx = end - y;
        slice.width = W; slice.height = hpx;
        sctx.fillStyle = '#ffffff'; sctx.fillRect(0, 0, W, hpx);
        sctx.drawImage(canvas, 0, y, W, hpx, 0, 0, W, hpx);
        if (!firstPage) pdf.addPage();
        firstPage = false;
        pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', PDF.mL, PDF.mT, contentW, hpx / pxPerMm);
        y = end;
      }
    }
    pdf.save(filename);
  } catch (err) {
    alert('Could not generate PDF: ' + (err && err.message ? err.message : err));
  }
}

// One-click PDF of the currently open conversation.
function savePdfCurrent() {
  if (!currentConv) return;
  generatePdf([currentConv], `kiln-${currentConv.session_id}.pdf`);
}

// ---- Plain-text export ----
// Produces a clean transcript suitable for feeding a prior session into a
// Great Physician (Barnabas) session as reference context. Reuses currentConv
// — the same normalized object the PDF export uses — so the GP/CTM dual-schema
// handling carries over for free.

function roleLabel(role) {
  const r = (role || '').toLowerCase();
  if (r === 'user' || r === 'counselee') return 'USER';
  if (r === 'assistant' || r === 'counselor' || r === 'barnabas') return 'COUNSELOR';
  return role ? role.toUpperCase() : 'UNKNOWN';
}

// Strip markdown emphasis/headings that leak into stored content so the feed is clean.
function cleanText(text) {
  return (text || '')
    .replace(/\*\*(.*?)\*\*/g, '$1')           // **bold**
    .replace(/(?<!\*)\*(?!\*)(.*?)\*/g, '$1')   // *italic*
    .replace(/^#{1,6}\s+/gm, '')                // headings
    .trim();
}

// Build the plain-text transcript for one normalized session object.
function conversationToTxt(convo, opts = {}) {
  const {
    includePreamble = true,
    includeId = false,
    includeCount = false,
  } = opts;

  const lines = [];

  if (includePreamble) {
    lines.push(
      'The following is a transcript of a previous counseling session, ' +
      'provided for context. It is not the current conversation.'
    );
    lines.push('');
  }

  const date = convo.date ? new Date(convo.date) : null;
  if (date && !isNaN(date)) lines.push(`Session date: ${date.toLocaleString()}`);

  const msgs = convo.messages || [];
  if (includeCount) lines.push(`${convo.source === 'gp' ? 'Messages' : 'Turns'}: ${msgs.length}`);
  if (includeId && convo.session_id) lines.push(`ID: ${convo.session_id}`);
  lines.push('='.repeat(50), '');

  if (convo.source === 'gp') {
    // GP schema: one row per message with role + content.
    for (const m of msgs) {
      lines.push(`${roleLabel(m.role)}:`);
      lines.push(cleanText(m.content));
      lines.push('');
    }
  } else {
    // CTM schema: one row per Q&A turn (user_message + ai_response paired).
    for (const m of msgs) {
      lines.push('USER:');
      lines.push(cleanText(m.user_message));
      lines.push('');
      lines.push('COUNSELOR:');
      lines.push(cleanText(m.ai_response));
      lines.push('');
    }
  }

  return lines.join('\n').trim() + '\n';
}

function downloadTxt(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// One-click .txt of the currently open conversation. ID/Count are off by
// default — toggled via the checkboxes in the conversation header.
function exportTxtCurrent() {
  if (!currentConv) return;
  const idCb = document.getElementById('txt-opt-id');
  const countCb = document.getElementById('txt-opt-count');
  const text = conversationToTxt(currentConv, {
    includeId: !!(idCb && idCb.checked),
    includeCount: !!(countCb && countCb.checked),
  });
  const stamp = currentConv.date && !isNaN(new Date(currentConv.date))
    ? new Date(currentConv.date).toISOString().slice(0, 10)
    : 'session';
  downloadTxt(`session-${stamp}.txt`, text);
}

// Fetch + combine all checked sessions into a single PDF.
async function printSelected() {
  if (!selected.size) return;
  const btn = document.getElementById('print-selected');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Preparing…';
  try {
    const items = [];
    for (const [sid, meta] of selected) {
      const data = await call({ action: 'messages', session_id: sid });
      if (data.error || !data.messages) continue;
      items.push({ session_id: sid, lang: meta.lang, date: meta.date, source: meta.source, messages: data.messages });
    }
    if (!items.length) { alert('No messages found for the selected sessions.'); return; }
    const filename = items.length === 1
      ? `kiln-${items[0].session_id}.pdf`
      : `kiln-conversations-${items.length}.pdf`;
    await generatePdf(items, filename);
  } finally {
    btn.textContent = orig;
    updateSelCount();
  }
}

// Delete every checked session (with a confirm). Removes them from the list
// and the selection as each one succeeds.
async function deleteSelected() {
  const n = selected.size;
  if (!n) return;
  if (!confirm(`Delete ALL messages for ${n} selected session(s)?\n\nThis cannot be undone.`)) return;
  const ds = document.getElementById('delete-selected');
  const ps = document.getElementById('print-selected');
  ds.disabled = true; ps.disabled = true;
  ds.textContent = 'Deleting…';
  // Snapshot id -> list element so we can remove rows without selector escaping.
  const elById = {};
  document.querySelectorAll('#session-list .session-item').forEach(it => { elById[it.dataset.id] = it; });
  const failed = [];
  for (const sid of Array.from(selected.keys())) {
    const data = await call({ action: 'delete', session_id: sid });
    if (data && data.error) { failed.push(sid); continue; }
    selected.delete(sid);
    if (elById[sid]) elById[sid].remove();
  }
  document.getElementById('select-all').checked = false;
  updateSelCount();
  loadStats();
  if (currentConv && !document.querySelector('.session-item.active')) {
    currentConv = null;
    document.getElementById('conversation-view').innerHTML = '<p class="placeholder">Select a session to view</p>';
  }
  if (failed.length) alert(`Could not delete ${failed.length} session(s). They remain in the list.`);
}

document.getElementById('print-selected').addEventListener('click', printSelected);
document.getElementById('delete-selected').addEventListener('click', deleteSelected);

// "Select all" toggles every session currently rendered in the list.
document.getElementById('select-all').addEventListener('change', e => {
  const on = e.target.checked;
  document.querySelectorAll('#session-list .s-cb').forEach(cb => {
    if (cb.checked !== on) { cb.checked = on; cb.dispatchEvent(new Event('change')); }
  });
});
</script>
